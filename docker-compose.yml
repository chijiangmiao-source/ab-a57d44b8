services:
  web:
    build: .
    image: interlink-parity-check:latest
    container_name: parity-check-web
    environment:
      # 容器内固定监听 8080；对外宿主机端口可用环境变量 HOST_PORT 配置
      PORT: "8080"
      HOST: "0.0.0.0"
    ports:
      # 宿主机端口可配置：HOST_PORT=9090 docker compose up web
      - "${HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    restart: unless-stopped

  # 一次性验收服务：围绕最小误码与规范裁决运行代码测试、
  # 页面构建检查，并对健康路径与复核页面做 API/HTTP 冒烟；
  # 完成后退出，以退出码（0=通过 / 非0=失败）报告结果。
  verify:
    build: .
    image: interlink-parity-check:latest
    container_name: parity-check-verify
    depends_on:
      web:
        condition: service_healthy
    environment:
      TARGET_URL: "http://web:8080"
    command: ["node", "test/run-all.js"]
    restart: "no"
